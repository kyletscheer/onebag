      .interactive-image {

        height: auto;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1),

        transition: transform 0.3s ease-in-out;
        cursor: default;
        border-radius: 0.75rem;
      }

      .hotspot-highlight {
        position: absolute;
        pointer-events: auto;
        background-color: rgba(67, 56, 202, 0.4);
        border: 2px solid #4338ca;
        border-radius: 6px;
        opacity: 0.6;
        transition: all 0.2s ease-in-out;
        cursor: pointer;
        text-align: center;
        overflow: hidden;
        z-index: 10;
      }

      .hotspot-highlight.is-external {
        background-color: rgba(16, 185, 129, 0.4);
        border-color: #059669;
      }

      .hotspot-highlight.is-info {
        background-color: rgba(107, 114, 128, 0.3);
        border-color: #4b5563;
        cursor: help;
      }

      .hotspot-highlight.search-match {
        background-color: rgba(251, 191, 36, 0.5);
        border-color: #f59e0b;
        animation: pulse-search 1.5s ease-in-out infinite;
      }

      @keyframes pulse-search {
        0%,
        100% {
          opacity: 0.7;
        }
        50% {
          opacity: 0.95;
        }
      }

      .hotspot-highlight:hover {
        opacity: 0.8;
        transform: scale(1.01);
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        z-index: 11;
      }

      .hotspot-label {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        padding: 2px 4px;
        font-size: 0.65rem;
        font-weight: bold;
        color: white;
        background-color: rgba(0, 0, 0, 0.7);
        pointer-events: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .footer {
        background-color: #f3f4f6;
        padding: 1rem;
        font-size: 0.875rem;
        color: #6b7280;
        align-items: center;
      }
      .footer a {
        text-decoration: underline;
      }
      .footer a:hover {
        color: #4f46e5;
      }
      .footer img {
        display: inherit;
      }

      /* Intro/Tutorial Styles */
      #intro-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s ease-in-out;
      }

      #intro-overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .closed-bag-container {
        text-align: center;
        animation: fadeInUp 0.8s ease-out;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .closed-bag-image {
        max-width: 500px;
        width: 90%;
        border-radius: 1rem;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        cursor: pointer;
        transition: all 0.3s ease;
        border: 4px solid rgba(255, 255, 255, 0.3);
      }

      .closed-bag-image:hover {
        transform: scale(1.05) rotate(2deg);
        box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.7);
      }

      /* Search Styles */
      #search-container {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 1000;
        transition: all 0.3s ease;
      }

      #search-container.expanded {
        right: 20px;
        top: 20px;
      }

      #search-results {
        max-height: 400px;
        overflow-y: auto;
      }

      .search-result-item:hover {
        background-color: #eef2ff;
      }

      /* Modal Styles */
      .modal-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.8);
        z-index: 2000;
        align-items: center;
        justify-content: center;
      }

      .modal-overlay.active {
        display: flex;
      }

.modal-content {
  background: white;
  border-radius: 1rem;
  padding: 1rem;
  width: 70vw;        /* 70% of viewport width */
  max-width: 75vw;    /* ensures large sizing */
  max-height: 80vh;   /* makes the modal taller */
  position: relative;
  animation: modalSlideIn 0.3s ease-out;
  display: flex;
  flex-direction: column;
}

      @keyframes modalSlideIn {
        from {
          opacity: 0;
          transform: scale(0.9);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* Smooth transitions */
      .view-transition {
        animation: fadeIn 0.3s ease-in-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* Video Button */
      #video-button {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 999;
      }

      @keyframes subtlePulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }

      const history = [];
      const imageElement = document.getElementById("main-image");
      const mapElement = document.getElementById("setupMap");
      const overlayContainer = document.getElementById("overlay-container");
      const titleElement = document.getElementById("current-view-title");
      const detailTitleElement = document.getElementById("detail-title");
      const detailDescriptionElement =
        document.getElementById("detail-description");
      const hotspotListElement = document.getElementById("hotspot-list");
      const backButton = document.getElementById("back-button");
      const breadcrumbElement = document.getElementById("breadcrumb");

      // Initialize icons
      lucide.createIcons();

      // Open bag animation
      function openBag() {
        const introOverlay = document.getElementById("intro-overlay");
        const mainContent = document.getElementById("main-content");
        const searchContainer = document.getElementById("search-container");
        const videoButton = document.getElementById("video-button");

        introOverlay.classList.add("hidden");
        setTimeout(() => {
          introOverlay.style.display = "none";
          mainContent.style.display = "block";
          searchContainer.classList.remove("hidden");
          videoButton.classList.remove("hidden");
          loadView("all-2.jpeg");
        }, 500);
      }

      // Search functionality
      function handleSearch(query) {
        const resultsContainer = document.getElementById("search-results");

        if (!query.trim()) {
          resultsContainer.innerHTML = "";
          currentSearchMatches = [];
          regenerateCurrentView();
          return;
        }

        const results = searchItems(query.toLowerCase());
        currentSearchMatches = results;

        if (results.length === 0) {
          resultsContainer.innerHTML =
            '<p class="text-sm text-gray-500 italic">No items found</p>';
          regenerateCurrentView();
          return;
        }

        resultsContainer.innerHTML = results
          .map(
            (result) => `
            <div class="search-result-item p-2 rounded cursor-pointer hover:bg-indigo-50 transition" onclick="navigateToResult('${
              result.viewId
            }', '${result.area.alt}')">
              <div class="font-semibold text-sm text-gray-800">${highlightMatch(
                result.area.alt,
                query
              )}</div>
              <div class="text-xs text-gray-500">${result.viewTitle}</div>
              ${
                result.area.info
                  ? `<div class="text-xs text-gray-400">${highlightMatch(
                      result.area.info,
                      query
                    )}</div>`
                  : ""
              }
            </div>
          `
          )
          .join("");

        // Regenerate current view to show highlights
        regenerateCurrentView();
      }

      function searchItems(query) {
        const results = [];

        for (const [viewId, view] of Object.entries(setupData)) {
          view.areas.forEach((area) => {
            const altMatch = area.alt.toLowerCase().includes(query);
            const infoMatch =
              area.info && area.info.toLowerCase().includes(query);

            if (altMatch || infoMatch) {
              results.push({
                viewId,
                viewTitle: view.title,
                area: area,
              });
            }
          });
        }

        return results;
      }

      function highlightMatch(text, query) {
        const regex = new RegExp(`(${query})`, "gi");
        return text.replace(regex, '<span class="bg-yellow-200">$1</span>');
      }

      function navigateToResult(viewId, itemAlt) {
        loadView(viewId);

        // Scroll to the item in the list
        setTimeout(() => {
          const listItems = hotspotListElement.querySelectorAll(".flex");
          listItems.forEach((item) => {
            if (item.textContent.includes(itemAlt)) {
              item.scrollIntoView({ behavior: "smooth", block: "nearest" });
              item.classList.add("bg-yellow-100");
              setTimeout(() => item.classList.remove("bg-yellow-100"), 2000);
            }
          });
        }, 100);
      }

      function clearSearch() {
        document.getElementById("search-input").value = "";
        document.getElementById("search-results").innerHTML = "";
        currentSearchMatches = [];
        regenerateCurrentView();
      }

      function regenerateCurrentView() {
        if (history.length > 0) {
          const currentViewId = history[history.length - 1];
          const currentView = setupData[currentViewId];
          if (currentView) generateVisualOverlays(currentView);
        }
      }

      // Video modal functions
      function openVideoModal() {
        const modal = document.getElementById("video-modal");
        const iframe = document.getElementById("youtube-iframe");

        // Use proper embed parameters
        const videoId = "ptFP0_i7kiE";
        const origin = window.location.origin;

        iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&origin=${origin}`;

        modal.classList.add("active");
        lucide.createIcons();
      }

      function closeVideoModal(event) {
        if (event && event.target !== document.getElementById("video-modal"))
          return;

        const modal = document.getElementById("video-modal");
        const iframe = document.getElementById("youtube-iframe");

        iframe.src = ""; // stops playback
        modal.classList.remove("active");
      }

      function getBoundingBox(shape, coords) {
        if (!coords || coords.length === 0) return null;
        if (shape === "rect" && coords.length === 4) {
          const x1 = Math.min(coords[0], coords[2]);
          const y1 = Math.min(coords[1], coords[3]);
          const x2 = Math.max(coords[0], coords[2]);
          const y2 = Math.max(coords[1], coords[3]);
          return [x1, y1, x2, y2];
        }
        if (shape === "poly" && coords.length >= 6 && coords.length % 2 === 0) {
          let minX = coords[0],
            minY = coords[1];
          let maxX = coords[0],
            maxY = coords[1];
          for (let i = 2; i < coords.length; i += 2) {
            minX = Math.min(minX, coords[i]);
            maxX = Math.max(maxX, coords[i]);
            minY = Math.min(minY, coords[i + 1]);
            maxY = Math.max(maxY, coords[i + 1]);
          }
          return [minX, minY, maxX, maxY];
        }
        return null;
      }

      function handleImageError(imgElement) {
        const originalSrc = imgElement.src;
        imgElement.onerror = null;
        imgElement.src = `https://placehold.co/${PLACEHOLDER_WIDTH}x${PLACEHOLDER_HEIGHT}/991B1B/FFFFFF?text=MISSING+FILE`;
        imgElement.alt = "Error: Image Missing";
        const failedFilename = originalSrc.split("/").pop();
        titleElement.textContent = `Error Loading Image`;
        detailTitleElement.textContent = `Error: Image File Not Found`;
        detailDescriptionElement.innerHTML = `File <code class="font-mono bg-red-100 p-1 rounded">${failedFilename}</code> missing.`;
        overlayContainer.innerHTML = "";
        hotspotListElement.innerHTML = `<p class="text-sm text-red-500 italic">No image loaded.</p>`;
      }

      function isSearchMatch(area) {
        if (currentSearchMatches.length === 0) return false;
        return currentSearchMatches.some(
          (match) =>
            match.area.alt === area.alt &&
            match.viewId === history[history.length - 1]
        );
      }

      function generateVisualOverlays(view) {
        const imgElWidth = imageElement.clientWidth;
        const imgElHeight = imageElement.clientHeight;
        const originalWidth = view.originalWidth;
        const originalHeight = view.originalHeight;

        if (!originalWidth || !originalHeight) return;

        const imgElRatio = imgElWidth / imgElHeight;
        const originalRatio = originalWidth / originalHeight;
        let displayedWidth, displayedHeight, offsetX, offsetY;

        if (imgElRatio > originalRatio) {
          displayedHeight = imgElHeight;
          displayedWidth = imgElHeight * originalRatio;
          offsetX = (imgElWidth - displayedWidth) / 2;
          offsetY = 0;
        } else {
          displayedWidth = imgElWidth;
          displayedHeight = imgElWidth / originalRatio;
          offsetX = 0;
          offsetY = (imgElHeight - displayedHeight) / 2;
        }

        const scaleX = displayedWidth / originalWidth;
        const scaleY = displayedHeight / originalHeight;

        mapElement.innerHTML = "";
        overlayContainer.innerHTML = "";

        if (view.areas.length > 0) {
          view.areas.forEach((area) => {
            const coords = area.coords
              .split(",")
              .map((c) => parseInt(c.trim()));

            const areaElement = document.createElement("area");
            areaElement.setAttribute("shape", area.shape || "rect");
            areaElement.setAttribute("coords", area.coords);
            areaElement.setAttribute("alt", area.alt);
            areaElement.href = "#";
            areaElement.onclick = (e) => {
              e.preventDefault();
              handleAreaClick(area);
            };
            mapElement.appendChild(areaElement);

            const boundingBox = getBoundingBox(area.shape, coords);
            if (boundingBox) {
              const [x1, y1, x2, y2] = boundingBox;
              const scaledX1 = x1 * scaleX + offsetX;
              const scaledY1 = y1 * scaleY + offsetY;
              const scaledWidth = (x2 - x1) * scaleX;
              const scaledHeight = (y2 - y1) * scaleY;

              const highlightDiv = document.createElement("div");

              let classList = "hotspot-highlight";
              if (isSearchMatch(area)) {
                classList += " search-match";
              } else if (area.externalLink && !area.targetView) {
                classList += " is-external";
              } else if (!area.targetView && !area.externalLink) {
                classList += " is-info";
              }

              highlightDiv.className = classList;
              highlightDiv.style.left = `${scaledX1}px`;
              highlightDiv.style.top = `${scaledY1}px`;
              highlightDiv.style.width = `${scaledWidth}px`;
              highlightDiv.style.height = `${scaledHeight}px`;
              highlightDiv.title = area.info || area.alt;

              let iconHtml = "";
              if (isSearchMatch(area)) {
                iconHtml =
                  '<i data-lucide="search" class="w-3 h-3 inline mr-1"></i>';
              } else if (area.externalLink && !area.targetView) {
                iconHtml =
                  '<i data-lucide="external-link" class="w-3 h-3 inline mr-1"></i>';
              } else if (!area.targetView) {
                iconHtml =
                  '<i data-lucide="info" class="w-3 h-3 inline mr-1"></i>';
              } else {
                iconHtml =
                  '<i data-lucide="zoom-in" class="w-3 h-3 inline mr-1"></i>';
              }

              highlightDiv.innerHTML = `<span class="hotspot-label">${iconHtml}${area.alt}</span>`;
              highlightDiv.onclick = (e) => {
                e.preventDefault();
                handleAreaClick(area);
              };

              overlayContainer.appendChild(highlightDiv);
            }
          });
          lucide.createIcons();
        }
      }

      function handleAreaClick(area) {
        if (area.targetView) {
          loadView(area.targetView);
        } else if (area.externalLink) {
          window.open(area.externalLink, "_blank");
        } else {
          detailTitleElement.textContent = area.alt;
          detailDescriptionElement.textContent =
            area.info || "No further details available.";
        }
      }

      function loadView(viewId, isNewView = true) {
        const view = setupData[viewId];
        if (!view) {
          console.error("View not found:", viewId);
          return;
        }

        if (isNewView && history[history.length - 1] !== viewId) {
          history.push(viewId);
        }

        overlayContainer.innerHTML = "";
        hotspotListElement.innerHTML = "";

        titleElement.textContent = `Current View: ${view.title}`;
        detailTitleElement.textContent = view.title;
        detailDescriptionElement.textContent = view.description;
        backButton.classList.toggle("hidden", history.length <= 1);
        updateBreadcrumb();

        renderHotspotList(view);

        imageElement.onload = null;
        imageElement.onerror = (e) => handleImageError(e.target);

        const handleOverlayGeneration = () => {
          requestAnimationFrame(() => {
            generateVisualOverlays(view);
          });
        };

        imageElement.onload = handleOverlayGeneration;
        imageElement.src = view.img;
        imageElement.alt = view.title;

        if (imageElement.complete) {
          handleOverlayGeneration();
        }
      }

      function renderHotspotList(view) {
        hotspotListElement.innerHTML = `<h3 class="text-lg font-medium text-gray-700 border-b pb-2 mb-3">Items in this view:</h3>`;
        if (view.areas.length > 0) {
          view.areas.forEach((area) => {
            const listItem = document.createElement("div");
            const isMatch = isSearchMatch(area);
            listItem.className = `flex items-center justify-between text-sm text-gray-700 p-2 ${
              isMatch ? "bg-yellow-100" : "bg-gray-100"
            } rounded-md hover:bg-gray-200 transition cursor-pointer mb-2`;

            let icon = "zoom-in";
            if (isMatch) icon = "search";
            else if (area.externalLink && !area.targetView)
              icon = "external-link";
            else if (!area.targetView) icon = "info";

            listItem.innerHTML = `
              <div>
                <span class="font-semibold block">${area.alt}</span>
                <span class="text-xs text-gray-500">${area.info || ""}</span>
              </div>
              <i data-lucide="${icon}" class="w-4 h-4 text-gray-400"></i>
            `;
            listItem.onclick = () => handleAreaClick(area);
            hotspotListElement.appendChild(listItem);
          });
          lucide.createIcons();
        } else {
          hotspotListElement.innerHTML = `<p class="text-sm text-gray-500 italic">No interactive items in this view.</p>`;
        }
      }

      function goBack() {
        if (history.length > 1) {
          history.pop();
          loadView(history[history.length - 1], false);
        }
      }

      function updateBreadcrumb() {
        breadcrumbElement.innerHTML = history
          .map((viewId, index) => {
            const view = setupData[viewId];
            const viewTitle = view
              ? view.title.split("(")[0].trim()
              : viewId.replace(".jpeg", "");

            if (index === history.length - 1) {
              return `<span class="font-bold text-indigo-600">${viewTitle}</span>`;
            } else {
              return `<a href="#" onclick="loadView('${viewId}', false)" class="text-indigo-400 hover:text-indigo-600">${viewTitle}</a>`;
            }
          })
          .join(' <span class="mx-1 font-medium text-gray-400">/</span> ');
      }

      let resizeTimer;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (history.length > 0) {
            const currentViewId = history[history.length - 1];
            const currentView = setupData[currentViewId];
            if (currentView) generateVisualOverlays(currentView);
          }
        }, 100);
      });

      window.onload = () => {
        lucide.createIcons();
      };
    </script>
  </body>
</html>
